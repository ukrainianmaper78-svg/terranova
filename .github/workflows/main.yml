name: Unzip

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  unzip:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip archive
        run: unzip -j standfade_norecoil.zip -d .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -m "chore: unzip standfade_norecoil.zip"
          git push
